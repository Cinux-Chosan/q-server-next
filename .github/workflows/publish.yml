name: Publish to npm

# 推送到 main 自动发布：发布前自动 patch 升级版本号，保证每次都是新版本，不会被跳过。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publisher（OIDC）需要；用 token 时也可保留
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (web + server)
        run: npm run build

      - name: Bump patch and publish to npm
        run: |
          # 自动 patch 升级（不产生 git commit/tag，避免触发工作流放循环）
          npm version patch --no-git-tag-version
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "发布 $PKG@$VER"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
